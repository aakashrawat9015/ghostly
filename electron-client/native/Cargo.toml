[package]
name = "ghostly-audio"
version = "0.1.0"
edition = "2021"
description = "NAPI-RS native audio capture addon for Ghostly — WASAPI loopback on Windows, CoreAudio on macOS"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19"
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.11"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
